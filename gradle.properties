org.gradle.caching = true
org.gradle.jvmargs = -Xms128M -Xmx2048M -XX:ActiveProcessorCount=2
org.gradle.parallel = false
org.gradle.workers.max = 2
org.gradle.priority = low
android.useAndroidX = true
# Lint skips a source over 2500 KB and fails the build for it. The generated L10nTranslations.java
# passed that size in November 2026, so lint gets room for it to keep growing.
systemProp.idea.max.intellisense.filesize = 8192
kotlin.code.style = official
version = 0.0.20
