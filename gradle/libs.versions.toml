[versions]
# Align with morphe-patches-template (Compatibility / Manager display names). Hold the patcher
# at the version the stable Morphe Manager bundles: a newer pin trips the manager's
# Patcher-Version gate and it refuses the bundle. Stable Manager 1.34.0 bundles 1.15.1, and so
# does desktop CLI 1.18.1, which the fixture gates run. 1.15.1 went stable on 2026-10-05: it stops
# a reused fingerprint match from handing back stale class and method objects and validates DEX
# entry paths, the rest is signing, DEX output and matching speed, and its public API only adds to
# 1.15.0's. It pulls in MorpheApp's ARSCLib 9b742c412d. Manager 1.33.0 carries 1.15.0 and refuses
# this bundle with its update prompt.
morphe-patcher = "1.15.1"
# First stable Manager release that bundled the patcher above. The release fact check holds the
# README's stated floor to this value.
manager-floor = "1.34.0"
# Read by the app.morphe.patches settings plugin, not by anything in this repo: remove it and
# configuration fails with "Version with alias smali not found in version catalog". The commit
# resolves as com.github.MorpheApp.smali through JitPack. It is not waiting on an official
# release, which google/smali 3.0.10 delivered on 2026-08-20. Keep it the commit the patcher
# above requests (1.14.1, 1.15.0 and 1.15.1 all ask for d856bad65f). Gradle merges the two requests
# into one module and keeps the version that sorts higher, not the newer commit: the old pin
# d92701d947, one commit behind d856bad65f, sorted higher and silently replaced the patcher's
# dexlib2 in every compile, test and R8 graph. Another group's smali would instead put two
# copies of dexlib2 on the R8 classpath, and buildAndroid fails with "Classpath type already
# present".
#noinspection GradleDependency
smali = "d856bad65f"
# The Android Gradle plugin and Kotlin come from the app.morphe.patches settings plugin
# (1.3.4 brings AGP 9.1.0 and Kotlin 2.4.10); nothing here pins them.
annotation = "1.10.0"
gson = "2.14.0"
# Test-only for the extension: see extensions/instagram/build.gradle.kts. The settings
# classpath forces every org.jetbrains.kotlin request to 2.4.20, so this matches it.
kotlin-stdlib = "2.4.20"
# The settings plugin classpath and every com.google.guava:guava request in :patches, :extensions:instagram and
# :extensions:shared:library is rewritten to this (GHSA-xxph-c9ww-hj94 covers everything
# before 33.7.2).
guava = "33.7.2-jre"
# Host test tooling only. GHSA-c4c3-7fpv-j4q5 is fixed in 4.1.137. Keep the modules
# aligned on the 4.1 line; the resolved-graph audit still checks every other dependency.
netty = "4.1.139.Final"
# Settings and UTP result-listener tools only. CVE-2025-48924 is fixed in 3.18.0;
# CVE-2020-13956 is fixed in 4.5.13. Keep the existing 3.x and 4.5.x consumer APIs.
commons-lang-tooling = "3.20.0"
httpclient-tooling = "4.5.14"
# Every org.bouncycastle request in this build is rewritten to this, in :extensions:instagram's
# test graph and in :patches' build graph. It has to be a version that publishes all three
# modules: 1.85.2 is a bcprov-only patch release, so forcing bcpkix and bcutil to it resolved
# nothing and the dependency report said FAILED while the build still succeeded. 1.86
# (2026-09-11) publishes bcprov, bcpkix and bcutil, and sits outside six advisories on
# versions below 1.85: CVE-2025-8916 (1.44 to 1.78), CVE-2026-5588 (1.67 to 1.83),
# CVE-2025-14813 and CVE-2026-0636 (both fixed in 1.84), CVE-2026-8763 and CVE-2026-13506
# (both fixed in 1.85). The patcher's own 1.77 is inside all six; the Android build tools'
# 1.79 is outside CVE-2025-8916 but inside the other five.
bouncycastle = "1.86"

[libraries]
morphe-patcher = { module = "app.morphe:morphe-patcher", version.ref = "morphe-patcher" }
annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-stdlib" }

[plugins]
android-library = { id = "com.android.library" }
